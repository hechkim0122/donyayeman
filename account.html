<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود و ثبت‌نام | دنیای من</title>
<meta name="theme-color" content="#2a1a4a">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@600&family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bar: #2a1a4a; --bar-soft: #3b2765; --gold: #ffc145;
    --paper: #f4f2fb; --card: #ffffff; --ink: #221838; --muted: #6b6485; --line: #d9d3ee;
    --head: #2a1a4a; --field: #faf9fe; --err: #d62839; --ok: #12803f;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --paper: #150d28; --card: #21163b; --ink: #ece7fa; --muted: #a99fc9; --line: #382c55;
    --head: #f1ecff; --field: #1a1031; --err: #ff6b78; --ok: #34d27b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Vazirmatn", Tahoma, sans-serif; background: var(--paper); color: var(--ink);
    line-height: 1.8; min-height: 100vh; transition: background-color .25s, color .25s;
  }
  .topbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--bar);
  }
  .icon-btn {
    flex: none; width: 44px; height: 44px; display: grid; place-items: center;
    border: 0; border-radius: 50%; background: var(--bar-soft); cursor: pointer; text-decoration: none;
  }
  .icon-btn:hover { background: #4d3680; }
  .icon-btn svg { width: 22px; height: 22px; stroke: #fff; }
  .brand {
    margin-right: auto; display: flex; align-items: baseline; gap: 3px; line-height: 1;
    white-space: nowrap; text-decoration: none; direction: ltr;
  }
  .b1 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 24px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .b2 { font-family: "Lilita One", sans-serif; font-size: 40px; color: #ff4a5a; text-shadow: 0 3px 0 rgba(0,0,0,.3), 0 0 18px rgba(255,74,90,.45); }
  .icon-btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  main { max-width: 440px; margin: 0 auto; padding: 32px 18px 56px; }
  .box {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(42,26,74,.12);
  }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bar); padding: 6px; gap: 6px; }
  .tab {
    border: 0; border-radius: 16px; padding: 11px; cursor: pointer; font: inherit; font-weight: 700; font-size: 16px;
    background: transparent; color: #cfc5ec; transition: background .2s, color .2s;
  }
  .tab[aria-selected="true"] { background: var(--gold); color: var(--bar); }
  form { padding: 24px 22px 26px; display: grid; gap: 16px; }
  form[hidden] { display: none; }
  h1 { font-family: "Lalezar", "Vazirmatn", sans-serif; font-weight: 400; font-size: 30px; color: var(--head); line-height: 1.3; }
  h1::after { content: ""; display: block; width: 48px; height: 4px; background: var(--gold); border-radius: 4px; margin-top: 6px; }
  .sub { color: var(--muted); font-size: 15px; margin-top: -6px; }
  .field label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .inp { position: relative; }
  .inp input {
    width: 100%; height: 50px; padding: 0 14px; border-radius: 14px; font: inherit; font-size: 16px;
    background: var(--field); color: var(--ink); border: 1.5px solid var(--line);
    transition: border-color .15s, box-shadow .15s;
  }
  .inp input:focus { outline: 0; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,193,69,.25); }
  .inp input[aria-invalid="true"] { border-color: var(--err); }
  .inp.pw input { padding-inline-end: 50px; }
  .eye {
    position: absolute; top: 50%; inset-inline-end: 8px; translate: 0 -50%;
    width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center;
  }
  .eye svg { width: 20px; height: 20px; stroke: var(--muted); }
  .eye:hover svg { stroke: var(--ink); }
  .err { color: var(--err); font-size: 13px; min-height: 0; margin-top: 4px; }
  .err:empty { display: none; }
  .ltr { direction: ltr; text-align: left; }
  .ltr::placeholder { text-align: left; }
  .submit {
    height: 52px; border: 0; border-radius: 16px; cursor: pointer; font: inherit; font-weight: 700; font-size: 17px;
    background: linear-gradient(145deg, #ffd36b, #ffb524); color: var(--bar);
    box-shadow: 0 8px 20px rgba(255,181,36,.35); transition: transform .15s;
  }
  .submit:hover { transform: translateY(-2px); }
  .msg { padding: 12px 14px; border-radius: 14px; font-size: 14px; background: rgba(18,128,63,.12); color: var(--ok); border: 1px solid var(--ok); }
  .msg[hidden] { display: none; }
  .switch { text-align: center; color: var(--muted); font-size: 14px; }
  .switch button { border: 0; background: none; color: var(--head); font: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }
  .msg.err { background: rgba(214,40,57,.1); color: var(--err); border-color: var(--err); }
  a.submit { display: grid; place-items: center; text-decoration: none; }
  .ghost { height: 52px; border-radius: 16px; cursor: pointer; font: inherit; font-weight: 700; font-size: 16px; background: var(--field); color: var(--ink); border: 1.5px solid var(--line); }
  .who { padding: 28px 22px 26px; display: grid; gap: 16px; text-align: center; }
  .who h1::after { margin-inline: auto; }
  .role { display: inline-block; justify-self: center; padding: 1px 14px; border-radius: 999px; background: var(--gold); color: var(--bar); font-weight: 700; font-size: 13px; }
  .hint { font-size: 13px; color: var(--muted); background: var(--field); border: 1px dashed var(--line); border-radius: 12px; padding: 8px 12px; }
  .hint[hidden] { display: none; }
  button:disabled { opacity: .6; cursor: default; }
  .demo { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <a class="icon-btn" href="index.html" data-en="Back to home" aria-label="بازگشت به خانه">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
  </a>
  <a class="brand" href="index.html" aria-label="donyayeman"><span class="b1">donyaye</span><span class="b2">man</span></a>
</header>

<main>
  <div class="box" id="whoBox" hidden>
    <div class="who">
      <h1 data-en="You are logged in">وارد شدی</h1>
      <p class="sub" id="whoText"></p>
      <span class="role" id="whoRole"></span>
      <a class="submit" href="index.html" data-en="Go to the site">رفتن به سایت</a>
      <button type="button" class="ghost" id="whoOut" data-en="Log out">خروج</button>
    </div>
  </div>
  <div class="box" id="formBox">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-signup" aria-selected="true" aria-controls="signup" data-en="Sign up">ثبت‌نام</button>
      <button class="tab" role="tab" id="tab-login" aria-selected="false" aria-controls="login" data-en="Log in">ورود</button>
    </div>

    <!-- Sign up -->
    <form id="signup" role="tabpanel" aria-labelledby="tab-signup" novalidate>
      <h1 data-en="Create account">ساخت حساب جدید</h1>
      <p class="sub" data-en="Join in a few seconds.">در چند ثانیه عضو شو.</p>
      <p class="hint" id="firstHint" data-en="This will be the first account, so you become the site admin." hidden>این اولین حسابه، پس مدیر سایت می‌شی.</p>
      <div class="field">
        <label for="s-name" data-en="Name">نام</label>
        <div class="inp"><input id="s-name" name="name" type="text" autocomplete="name" data-en-ph="Your name" placeholder="نام شما"></div>
        <div class="err" data-for="s-name"></div>
      </div>
      <div class="field">
        <label for="s-email" data-en="Email">ایمیل</label>
        <div class="inp"><input id="s-email" class="ltr" name="email" type="email" autocomplete="email" placeholder="you@example.com" inputmode="email"></div>
        <div class="err" data-for="s-email"></div>
      </div>
      <div class="field">
        <label for="s-pass" data-en="Password">رمز عبور</label>
        <div class="inp pw"><input id="s-pass" class="ltr" name="password" type="password" autocomplete="new-password" placeholder="••••••••">
          <button type="button" class="eye" aria-label="نمایش رمز" data-en="Show password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="err" data-for="s-pass"></div>
      </div>
      <div class="field">
        <label for="s-pass2" data-en="Confirm password">تکرار رمز عبور</label>
        <div class="inp pw"><input id="s-pass2" class="ltr" name="password2" type="password" autocomplete="new-password" placeholder="••••••••">
          <button type="button" class="eye" aria-label="نمایش رمز" data-en="Show password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="err" data-for="s-pass2"></div>
      </div>
      <div class="msg" role="status" hidden></div>
      <button class="submit" type="submit" data-en="Sign up">ثبت‌نام</button>
      <div class="switch"><span data-en="Already have an account?">قبلاً ثبت‌نام کردی؟</span> <button type="button" data-go="login" data-en="Log in">ورود</button></div>
    </form>

    <!-- Log in -->
    <form id="login" role="tabpanel" aria-labelledby="tab-login" novalidate hidden>
      <h1 data-en="Welcome back">خوش برگشتی</h1>
      <p class="sub" data-en="Log in to your account.">وارد حسابت شو.</p>
      <div class="field">
        <label for="l-email" data-en="Email">ایمیل</label>
        <div class="inp"><input id="l-email" class="ltr" name="email" type="email" autocomplete="email" placeholder="you@example.com" inputmode="email"></div>
        <div class="err" data-for="l-email"></div>
      </div>
      <div class="field">
        <label for="l-pass" data-en="Password">رمز عبور</label>
        <div class="inp pw"><input id="l-pass" class="ltr" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
          <button type="button" class="eye" aria-label="نمایش رمز" data-en="Show password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="err" data-for="l-pass"></div>
      </div>
      <div class="msg" role="status" hidden></div>
      <button class="submit" type="submit" data-en="Log in">ورود</button>
      <div class="switch"><span data-en="New here?">تازه اومدی؟</span> <button type="button" data-go="signup" data-en="Sign up">ثبت‌نام</button></div>
    </form>
  </div>
  <p class="demo" id="demoNote" data-en="For now, data is stored only in this browser. The first account becomes the admin.">فعلاً اطلاعات فقط روی همین مرورگر ذخیره می‌شه. اولین حساب ساخته‌شده، مدیر سایته.</p>
</main>

<script src="api.js"></script>
<script>
  let lang = 'fa';
  try { if (localStorage.getItem('lang') === 'en') lang = 'en'; } catch (e) {}

  const T = {
    name: ['نام رو وارد کن.', 'Please enter your name.'],
    emailEmpty: ['ایمیل رو وارد کن.', 'Please enter your email.'],
    emailBad: ['ایمیل معتبر نیست.', 'Email is not valid.'],
    passEmpty: ['رمز عبور رو وارد کن.', 'Please enter your password.'],
    passShort: ['رمز عبور باید حداقل ۸ کاراکتر باشه.', 'Password must be at least 8 characters.'],
    passMismatch: ['رمزها یکسان نیستن.', 'Passwords do not match.'],
    okSignup: ['حساب ساخته شد. در حال رفتن به سایت...', 'Account created. Taking you to the site...'],
    okLogin: ['وارد شدی. در حال رفتن به سایت...', 'Logged in. Taking you to the site...'],
    errTaken: ['این ایمیل قبلاً ثبت شده. وارد شو.', 'This email is already registered. Log in instead.'],
    errBad: ['ایمیل یا رمز عبور اشتباهه.', 'Email or password is wrong.'],
    errInvalid: ['اطلاعات واردشده معتبر نیست.', 'The information entered is not valid.'],
    errGeneric: ['مشکلی پیش اومد. دوباره امتحان کن.', 'Something went wrong. Please try again.'],
    show: ['نمایش رمز', 'Show password'],
    hide: ['پنهان کردن رمز', 'Hide password'],
    title: ['ورود و ثبت‌نام | دنیای من', 'Log in and sign up | My World'],
    admin: ['مدیر سایت', 'Site admin'],
    user: ['کاربر', 'User'],
    as: ['با این حساب وارد شدی:', 'You are logged in as:']
  };
  const t = (k) => T[k][lang === 'en' ? 1 : 0];
  const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
  let who = null;

  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-en]').forEach((el) => {
      const isAttr = el.classList.contains('eye') || el.tagName === 'A' && el.classList.contains('icon-btn');
      if (el.__fa === undefined) el.__fa = isAttr ? el.getAttribute('aria-label') : el.textContent;
      const val = lang === 'en' ? el.getAttribute('data-en') : el.__fa;
      if (isAttr) el.setAttribute('aria-label', val); else el.textContent = val;
    });
    document.querySelectorAll('[data-en-ph]').forEach((el) => {
      if (el.__fa === undefined) el.__fa = el.getAttribute('placeholder');
      el.setAttribute('placeholder', lang === 'en' ? el.getAttribute('data-en-ph') : el.__fa);
    });
    document.title = t('title');
    document.querySelectorAll('.eye').forEach((b) => {
      b.setAttribute('aria-label', b.parentElement.querySelector('input').type === 'text' ? t('hide') : t('show'));
    });
    document.querySelectorAll('.err').forEach((e) => { if (e.__k) e.textContent = t(e.__k); });
    document.querySelectorAll('.msg:not([hidden])').forEach((m) => { if (m.__k) m.textContent = t(m.__k); });
    if (who) renderWho();
  }

  // زبان و تم از صفحه اصلی گرفته می‌شن
  window.addEventListener('storage', (e) => {
    if (e.key === 'lang') { lang = e.newValue === 'en' ? 'en' : 'fa'; applyLang(); }
    if (e.key === 'theme') {
      if (e.newValue === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
    }
    if (e.key && e.key.indexOf('dm:v1:') === 0) loadWho();
  });

  // ---------- تب‌ها ----------
  function showTab(name) {
    ['signup', 'login'].forEach((n) => {
      document.getElementById(n).hidden = n !== name;
      document.getElementById('tab-' + n).setAttribute('aria-selected', n === name);
    });
    if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  }
  document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.id.replace('tab-', ''))));
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.go)));

  document.querySelectorAll('.eye').forEach((b) => b.addEventListener('click', () => {
    const i = b.parentElement.querySelector('input');
    i.type = i.type === 'password' ? 'text' : 'password';
    b.setAttribute('aria-label', i.type === 'text' ? t('hide') : t('show'));
  }));

  // ---------- اعتبارسنجی ----------
  const setErr = (id, key) => {
    const e = document.querySelector('.err[data-for="' + id + '"]');
    const i = document.getElementById(id);
    e.__k = key || null;
    e.textContent = key ? t(key) : '';
    i.setAttribute('aria-invalid', key ? 'true' : 'false');
    return !key;
  };
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  const val = (id) => document.getElementById(id).value.trim();
  const raw = (id) => document.getElementById(id).value;

  function showMsg(form, key, isErr) {
    const m = form.querySelector('.msg');
    m.__k = key; m.textContent = t(key);
    m.classList.toggle('err', !!isErr);
    m.setAttribute('role', isErr ? 'alert' : 'status');
    m.hidden = false;
  }
  function handle(form, checks, action, okKey) {
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      form.querySelector('.msg').hidden = true;
      const results = checks().map(([id, key]) => setErr(id, key));
      if (!results.every(Boolean)) {
        const first = form.querySelector('[aria-invalid="true"]');
        if (first) first.focus();
        return;
      }
      const btn = form.querySelector('.submit');
      btn.disabled = true;
      try {
        await action();
        form.reset();
        showMsg(form, okKey, false);
        setTimeout(() => { location.href = 'index.html'; }, 900);
      } catch (e) {
        const c = e && (e.code || e.message);
        showMsg(form, c === 'email_taken' ? 'errTaken' : c === 'bad_credentials' ? 'errBad' : c === 'invalid' ? 'errInvalid' : 'errGeneric', true);
        btn.disabled = false;
      }
    });
    form.addEventListener('input', (ev) => { if (ev.target.id) setErr(ev.target.id, null); });
  }

  handle(document.getElementById('signup'), () => [
    ['s-name', val('s-name') ? null : 'name'],
    ['s-email', !val('s-email') ? 'emailEmpty' : (emailRe.test(val('s-email')) ? null : 'emailBad')],
    ['s-pass', raw('s-pass').length >= 8 ? null : (raw('s-pass') ? 'passShort' : 'passEmpty')],
    ['s-pass2', raw('s-pass2') && raw('s-pass2') === raw('s-pass') ? null : 'passMismatch']
  ], () => Api.auth.register({ name: val('s-name'), email: val('s-email'), password: raw('s-pass') }), 'okSignup');

  handle(document.getElementById('login'), () => [
    ['l-email', !val('l-email') ? 'emailEmpty' : (emailRe.test(val('l-email')) ? null : 'emailBad')],
    ['l-pass', raw('l-pass') ? null : 'passEmpty']
  ], () => Api.auth.login({ email: val('l-email'), password: raw('l-pass') }), 'okLogin');

  // ---------- اگه از قبل وارد شده بود ----------
  function renderWho() {
    document.getElementById('whoText').textContent = t('as') + ' ' + who.name + ' (' + who.email + ')';
    document.getElementById('whoRole').textContent = who.role === 'admin' ? t('admin') : t('user');
  }
  async function loadWho() {
    try { who = await Api.auth.me(); } catch (e) { who = null; }
    document.getElementById('whoBox').hidden = !who;
    document.getElementById('formBox').hidden = !!who;
    if (who) renderWho();
    try { document.getElementById('firstHint').hidden = who || !(await Api.auth.firstUser()); } catch (e) { /* مهم نیست */ }
  }
  document.getElementById('whoOut').addEventListener('click', async () => {
    try { await Api.auth.logout(); } catch (e) { /* مهم نیست */ }
    await loadWho();
  });

  showTab(location.hash === '#login' ? 'login' : 'signup');
  applyLang();
  loadWho();
</script>
</body>
</html>
